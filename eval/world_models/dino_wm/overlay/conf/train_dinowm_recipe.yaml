# Pipeline check of the ALPS paper: the DINO-WM encoder (DINOv2-S/14, conf/encoder/dino.yaml) and predictor
# (conf/predictor/vit.yaml) trained with the DINO-WM schedule (constant learning rate, batch 32 unless overridden) by the
# official train.py, for a fixed number of optimizer updates. A copy of conf/train.yaml with these changes:
#  * decoder off (has_decoder false, model.train_decoder false): no VQ-VAE, no reconstruction loss;
#  * training.max_steps optimizer updates instead of epochs; step checkpoints model_s<step>.pth every
#    training.save_every_x_steps and model_final.pth (= model_latest.pth) at the budget;
#  * the train split restricted to and ordered by subsets/<task>_100.json (make_subsets.py; all train trajectories);
#  * a fixed run directory ${ckpt_base_path}/outputs/${run_name} (required with several processes).
# Launch: scripts/train_dinowm_recipe.sh (accelerate launch train.py --config-name train_dinowm_recipe.yaml ...).
defaults:
  - env: pusht
  - encoder: dino
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: vit
  - override hydra/launcher: submitit_slurm
  - _self_

ckpt_base_path: ???                   # checkpoints go to ${ckpt_base_path}/outputs/${run_name}
task: ${env.name}                     # pass task=rope / task=granular with env=deformable_env
subset_dir: ???                       # folder of make_subsets.py
run_name: ${task}_dinov2_vits14_dinowm_recipe

hydra:
  run:
    dir: ${ckpt_base_path}/outputs/${run_name}
  sweep:
    dir: ${ckpt_base_path}/outputs/${run_name}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 8
    mem_gb: 512
    gres: "gpu:h100:1"
    timeout_min: 2880
    setup: ["export DEBUGVAR=$(scontrol show hostnames $SLURM_JOB_NODELIST)",
            export MASTER_ADDR="$(scontrol show hostnames $SLURM_JOB_NODELIST | head -n 1)",
            "export MASTER_PORT=$(for port in $(shuf -i 30000-65500 -n 20); do if [[ $(netstat -tupln 2>&1 | grep $port | wc -l) -eq 0 ]] ; then echo $port; break; fi; done;)",]

training:
  seed: 0
  epochs: 1000000            # not the budget: the run stops at max_steps
  batch_size: 32             # global batch per optimizer update (per process: batch_size / number of processes)
  max_steps: 62000           # optimizer updates (pass the budget on the command line)
  save_every_x_steps: 100000
  save_every_x_epoch: 1000000   # per-epoch checkpoints off (step checkpoints instead)
  log_every_steps: 500
  traj_subset: ${subset_dir}/${task}_100.json
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 6
  encoder_lr: 1e-6
  decoder_lr: 3e-4
  predictor_lr: 5e-4
  action_encoder_lr: 5e-4

img_size: 224 # should be a multiple of 224
frameskip: 5
concat_dim: 1

normalize_action: True

# action encoder
action_emb_dim: 10
num_action_repeat: 1

# proprio encoder
proprio_emb_dim: 10
num_proprio_repeat: 1

num_hist: 3
num_pred: 1 # only supports 1
has_predictor: True
has_decoder: False

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: False
  train_predictor: True
  train_decoder: False

debug: False

# planning jobs launched during training: off (plan with plan.py after training)
plan_settings:
  plan_cfg_path: null
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]

env:
  dataset:
    traj_subset: ${training.traj_subset}
